<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "Loan Calc", "url": "https://s3eidat.github.io/loan-calc/", "description": "Monthly payment and full amortization table. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/loan-calc/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>

<body data-tool="loan-calc">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Loan Calc</h1>
    <p>Monthly payment, total interest and the full amortization schedule for any loan or mortgage. Add an extra monthly payment to see how much sooner you are debt-free.</p>
  </section>

  <div class="lc-grid">
    <section class="card stack">
      <h2>Your loan</h2>
      <label class="field">Loan amount
        <input class="input" id="amount" inputmode="decimal" autocomplete="off" placeholder="250,000">
      </label>
      <label class="field">Annual interest rate
        <span class="adorn"><input class="input" id="rate" inputmode="decimal" autocomplete="off" placeholder="6.5"><i>%</i></span>
      </label>
      <div class="field">
        <label for="term">Term</label>
        <div class="row nowrap">
          <input class="input grow" id="term" inputmode="numeric" autocomplete="off" placeholder="30">
          <div class="seg" id="unit" role="group" aria-label="Term unit">
            <button type="button" data-v="y" aria-pressed="true">Years</button>
            <button type="button" data-v="m" aria-pressed="false">Months</button>
          </div>
        </div>
      </div>
      <label class="field"><span>Extra monthly payment <span class="faint">(optional)</span></span>
        <input class="input" id="extra" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <label class="field">First payment
        <input class="input" id="start" type="month">
      </label>
      <p class="faint" id="err" role="alert"></p>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>Result</h2>
        <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy summary</button>
      </div>
      <div class="stats" id="stats"></div>
      <div id="saved" class="saved" hidden></div>
      <canvas class="chart" id="chart" role="img" aria-label="Principal and interest paid per year, with remaining balance"></canvas>
      <div class="legend"><span><i class="k-p"></i>Principal</span><span><i class="k-i"></i>Interest</span><span><i class="k-b"></i>Balance</span></div>
    </section>
  </div>

  <section class="card mt">
    <div class="row between">
      <h2>Amortization schedule</h2>
      <div class="row">
        <div class="seg" id="view" role="group" aria-label="Schedule view">
          <button type="button" data-v="year" aria-pressed="true">Yearly</button>
          <button type="button" data-v="month" aria-pressed="false">Monthly</button>
        </div>
        <button class="btn small" id="csv"><svg class="i"><use href="#i-download"/></svg>CSV</button>
      </div>
    </div>
    <div class="tbl-wrap sched mt"><table class="tbl" id="table"></table></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
